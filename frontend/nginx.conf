server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers importés peuvent atteindre 25 Mo (limite fixée dans multer).
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # L'API passe par la même origine : aucune configuration CORS nécessaire.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'envoi d'une newsletter parcourt les destinataires un par un :
        # sur plusieurs centaines de fiches, la requête peut durer longtemps.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Fichiers versionnés par le build : leur nom change à chaque modification.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /brand/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Jamais mis en cache, sinon une mise à jour ne serait pas vue par les navigateurs.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Application monopage : toutes les autres routes sont gérées côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité de base.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
}
